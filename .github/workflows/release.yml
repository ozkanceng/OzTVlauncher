name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OZLAUNCHER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OZLAUNCHER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OZLAUNCHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OZLAUNCHER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ozlauncher-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/ozlauncher-release.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > signing.properties
      - name: Quality gate and signed build
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleRelease
      - name: Prepare artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk "OZLauncher-${GITHUB_REF_NAME}.apk"
          shasum -a 256 "OZLauncher-${GITHUB_REF_NAME}.apk" > "OZLauncher-${GITHUB_REF_NAME}.apk.sha256"
          ./scripts/verify-release.sh "OZLauncher-${GITHUB_REF_NAME}.apk"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "OZLauncher-${GITHUB_REF_NAME}.apk" "OZLauncher-${GITHUB_REF_NAME}.apk.sha256" --title "OZLauncher ${GITHUB_REF_NAME}" --generate-notes
