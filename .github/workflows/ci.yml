name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test, lint and release build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verify privacy and size
        run: ./scripts/verify-release.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
